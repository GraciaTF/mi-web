<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Contacto | Gracia - Desarrollo de Aplicaciones</title>

<meta name="description"
    content="Contacta con Gracia, estudiante de Desarrollo de Aplicaciones.">

<link rel="stylesheet" href="style.css">


</head>

<body>


<!-- CABECERA Y MENÚ -->
<header>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="index.html#sobre-mi">Sobre mí</a>
        <a href="index.html#me-gusta">Me gusta</a>
        <a href="contacto.html" class="activo">Contacto</a>
    </nav>
</header>


<!-- CONTENIDO PRINCIPAL -->
<main class="pagina-contacto">

    <section class="contacto-intro">

        <h1>Hablemos</h1>

        <p>
            Si tienes una idea, un proyecto o simplemente quieres
            hablar de programación, puedes escribirme a través de este formulario.
        </p>

    </section>


    <!-- FORMULARIO -->
    <section class="contacto-formulario">

        <form id="formulario-contacto">

            <div class="campo-formulario">
                <label for="nombre">Nombre *</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    required>
            </div>


            <div class="campo-formulario">
                <label for="email">Correo electrónico *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu@email.com"
                    required>
            </div>


            <div class="campo-formulario">
                <label for="telefono">Teléfono <span>(opcional)</span></label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Tu teléfono">
            </div>


            <div class="campo-formulario">
                <label for="mensaje">Mensaje *</label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    placeholder="Cuéntame en qué puedo ayudarte..."
                    required></textarea>
            </div>


            <button type="submit" class="boton-contacto">
                Enviar mensaje
            </button>

        </form>

    </section>


    <!-- OTRAS FORMAS DE CONTACTO -->
    <section class="otras-formas-contacto">

        <p>También puedes encontrarme aquí:</p>

        <div class="enlaces-contacto">

            <a href="mailto:graciatortajadaferris@gmail.com">
                Correo
            </a>

            <a href="https://github.com/GraciaTF"
               target="_blank"
               rel="noopener noreferrer">
                GitHub
            </a>

            <a href="https://www.linkedin.com/in/gracia-tortajada-48872050/"
               target="_blank"
               rel="noopener noreferrer">
                LinkedIn
            </a>

        </div>

    </section>

</main>


<!-- PIE DE PÁGINA -->
<footer>

    <p>
        Gracia · 2026
    </p>

</footer>


</body>

</html>
